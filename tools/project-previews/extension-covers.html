<!doctype html><html><head><meta charset="utf-8"><title>Extension UI showcases</title><style>
@import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap');
@import url('/fonts/instrument-serif-2760b2c0d4.css');
*{box-sizing:border-box}html,body{margin:0;width:1672px;height:941px;overflow:hidden}body{font-family:Switzer,Arial,sans-serif;color:#f5f5f7;background:#08090d}.cover{position:relative;width:100%;height:100%;overflow:hidden}.brand{position:absolute;display:flex;align-items:center;gap:18px;font-size:38px;letter-spacing:-1.3px;z-index:4;font-weight:500}.brand img{width:50px;height:50px;border-radius:11px}.screen{position:absolute;overflow:hidden;border:1px solid #ffffff26;border-radius:24px;box-shadow:0 40px 80px #0008,0 5px 12px #0005;background:#10131b}.screen img{display:block;width:100%;height:auto}
/* Audio: one complete popup, with a large close-up of the six-band controls. */
.tvm{background:radial-gradient(ellipse at 80% 65%,#263e9155,transparent 65%),linear-gradient(135deg,#06080d,#10192f)}.tvm .brand{left:90px;top:65px}.tvm .volume{width:665px;left:133px;top:222px;transform:perspective(1800px) rotateY(7deg) rotateZ(-7deg)}.tvm .equalizer{width:700px;left:820px;top:272px;transform:perspective(1800px) rotateY(-7deg) rotateZ(4deg);padding:22px;background:#1b202b}.equalizer .panel-heading{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 21px;font-size:27px;letter-spacing:-.7px}.equalizer .panel-heading svg{width:29px;height:29px;stroke:#95a9ff;fill:none;stroke-width:1.5}.equalizer img{border-radius:18px}
/* Color: an actual picker on top of a clean palette working canvas. */
.palette{background:linear-gradient(140deg,#17000b,#3a0921 52%,#14000b)}.palette .brand{left:88px;top:64px}.palette .canvas{position:absolute;left:88px;top:173px;width:1150px;height:670px;border:1px solid #ffffff28;border-radius:17px;overflow:hidden;background:#f5e9ee;box-shadow:0 35px 90px #0008}.canvas-bar{height:58px;border-bottom:1px solid #36223115;background:#fffbfd;display:flex;align-items:center;gap:9px;padding:0 23px;color:#76606d;font-size:18px}.canvas-bar i{width:10px;height:10px;border-radius:50%;background:#cebcc5}.canvas-bar span{margin-left:24px}.palette-work{padding:42px;color:#3b1830}.palette-work h2{font-size:45px;line-height:1;font-weight:500;letter-spacing:-1.6px;margin:0 0 32px}.swatches{display:flex;width:100%;height:425px;overflow:hidden;border-radius:7px}.swatch{flex:1;display:flex;align-items:flex-end;padding:25px 19px;font-size:18px;color:white}.swatch.light{color:#3b1830}.palette .picker{width:495px;height:613px;left:1080px;top:270px;border-radius:17px;box-shadow:-20px 35px 90px #0007;background:#180009}.picker img{width:100%}
/* Type: a specimen sheet, with the real font detail UI on top. */
.font{color:#2a1744;background:radial-gradient(ellipse at 90% 100%,#c8b1ef,transparent 65%),#eee9f5}.font .brand{left:88px;top:64px}.specimen{position:absolute;left:130px;top:205px;width:715px;height:590px}.specimen .family{font-size:25px;letter-spacing:-.6px;color:#725391}.specimen .letters{font-family:'Instrument Serif',serif;font-size:490px;line-height:.95;letter-spacing:-22px;color:#6132a2;margin-left:-25px}.specimen .alphabet{font-family:'Instrument Serif',serif;font-size:38px;letter-spacing:2px;margin-top:18px;color:#7d5b9d}.font .detail{width:490px;left:1020px;top:130px;transform:rotate(5deg);background:#fff;border-color:#7553a51a;border-radius:20px;box-shadow:0 28px 80px #41215e26,0 4px 8px #41215e12}
</style></head><body><main class="cover"></main><script>
const name=new URLSearchParams(location.search).get('project')||'tab-volume-manager';
const brand=(name,src)=>`<div class="brand"><img src="${src}" alt=""><span>${name}</span></div>`;
const configs={
 'tab-volume-manager':{class:'tvm',html:brand('Tab Volume Manager','/tab-volume-manager/icon.png')+`<div class="screen volume"><img src="/assets/covers/ui/tvm-volume.png" alt="Volume controls"></div><div class="screen equalizer"><div class="panel-heading">Equalizer<svg viewBox="0 0 24 24"><path d="M5 3v18M12 3v18M19 3v18"/><rect x="2" y="7" width="6" height="4" rx="2" fill="#1b202b"/><rect x="9" y="14" width="6" height="4" rx="2" fill="#1b202b"/><rect x="16" y="5" width="6" height="4" rx="2" fill="#1b202b"/></svg></div><img src="/assets/covers/ui/tvm-eq-board.png" alt="Six-band equalizer"></div>`},
 'palette-pilot':{class:'palette',html:brand('Palette Pilot','/palette-pilot/icon.png')+`<div class="canvas"><div class="canvas-bar"><i></i><i></i><i></i><span>Color workspace</span></div><div class="palette-work"><h2>After hours</h2><div class="swatches"><div class="swatch" style="background:#FF006A">#FF006A</div><div class="swatch light" style="background:#FF8DBD">#FF8DBD</div><div class="swatch light" style="background:#F7D8E7">#F7D8E7</div><div class="swatch" style="background:#7D2254">#7D2254</div><div class="swatch" style="background:#39223D"></div></div></div></div><div class="screen picker"><img src="/assets/covers/ui/palette-home.png" alt="Palette Pilot color picker"></div>`},
 'font-pirate':{class:'font',html:brand('Font Pirate','/font-pirate/assets/icon.png')+`<div class="specimen"><div class="family">Instrument Serif</div><div class="letters">Aa</div><div class="alphabet">abcdefghi jklmnopqr stuvwxyz</div></div><div class="screen detail"><img src="/font-pirate/assets/font-detail.webp" alt="Font Pirate type preview"></div>`}
};const config=configs[name];document.querySelector('.cover').classList.add(config.class);document.querySelector('.cover').innerHTML=config.html;
</script></body></html>
